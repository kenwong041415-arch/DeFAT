name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # the "test-build" pre-release below is updated in place

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # The Firebase config is gitignored (docs/06), so every build has to
      # recreate it. The secret is NOT available to workflows triggered by pull
      # requests from forks, so this step (and therefore the build) fails for
      # them. That is accepted: only the owner pushes here. If a contributor ever
      # does, they need their own Firebase project and a copy of
      # app/google-services.example.json filled in.
      #
      # The explicit emptiness check matters: without it a missing secret writes
      # an empty file and the build dies later with an unrelated-looking Gradle
      # error.
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICES_JSON}" ]; then
            echo "GOOGLE_SERVICES_JSON secret is not set" >&2
            exit 1
          fi
          printf '%s' "${GOOGLE_SERVICES_JSON}" > app/google-services.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # `packages` must stay set. The action's v3 default is
      # "tools platform-tools", and Google has removed the long-deprecated
      # `tools` package from the SDK repository, so sdkmanager exits 1 on a
      # package it can no longer resolve and the whole job dies before Gradle
      # runs. This broke every build between 2026-08-12 (last green) and
      # 2026-10-12 with no change on our side. Do not delete this input as
      # redundant; `platform-tools` is the only part we actually need, and
      # Gradle fetches the platform and build-tools itself.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Domain unit tests (pure Kotlin)
        run: ./gradlew --no-daemon :core-domain:test

      - name: Android unit tests
        run: ./gradlew --no-daemon :core-data:testDebugUnitTest :app:testDebugUnitTest

      - name: Lint (fails on missing translations)
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload exported Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: core-data/schemas/**
          if-no-files-found: error
          retention-days: 14
      # TODO(phase1.6 M-3, deferred): once authentic 1.json and 2.json are
      # committed (downloaded from this artifact and committed verbatim —
      # see docs/plans/phase1.6-ui-revision-plan.md §3 R2 and §15), add the
      # permanent drift guard here:
      #   - name: Fail if the exported Room schema drifts from the committed one
      #     run: git diff --exit-code -- core-data/schemas
      # Adding it now would fail every run, since no schema files are
      # committed yet in this PR (the CI artifact download step cannot run
      # from this dev container).

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: defat-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # Actions artifacts require a signed-in GitHub account to download, which
      # is a dead end for the project owner on a phone (GitHub answers 404).
      # A pre-release asset has a stable, login-free direct link instead:
      #   https://github.com/<owner>/<repo>/releases/download/test-build/app-debug.apk
      - name: Publish the APK as the rolling test build
        if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view test-build >/dev/null 2>&1 || gh release create test-build \
            --prerelease \
            --title "DeFAT test build" \
            --notes "Latest debug build. Download app-debug.apk below and tap it on your Android phone. Not from the Play Store, so Android will ask you to allow installing from your browser or file manager."
          gh release upload test-build app/build/outputs/apk/debug/app-debug.apk --clobber
          gh release edit test-build \
            --notes "Latest debug build, from commit \`${GITHUB_SHA:0:7}\` on \`${GITHUB_REF_NAME}\` ($(date -u '+%Y-%m-%d %H:%M UTC')).

          Download **app-debug.apk** below and tap it on your Android phone. It is not from the Play Store, so Android will ask you to allow installing from your browser or file manager — that is expected for a test build."

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            core-domain/build/reports/tests/**
            app/build/reports/**
            core-data/build/reports/**
          if-no-files-found: ignore
          retention-days: 14
